<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SirTros Video</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{
    --bg:#0f0f0f;
    --panel:#212121;
    --hover:#333;
    --text:#fff;
    --gray:#aaa;
    --red:#ff0000;
}


*{
    box-sizing:border-box;
}


body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:Arial,sans-serif;
    overflow:hidden;
}


/* ===== HEADER ===== */

header{

    height:60px;
    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 20px;

    border-bottom:1px solid #222;

}


.logo{

    display:flex;
    align-items:center;
    gap:10px;

    font-size:22px;
    font-weight:bold;

}



.logo-box{

    width:35px;
    height:25px;

    background:red;
    border-radius:8px;

    position:relative;

}



.logo-box:after{

    content:"";

    position:absolute;

    left:13px;
    top:7px;

    border-left:10px solid white;
    border-top:6px solid transparent;
    border-bottom:6px solid transparent;

}



.search{

    width:400px;

    padding:12px 20px;

    border-radius:30px;

    background:#121212;

    border:1px solid #333;

    color:white;

    outline:none;

}




/* ===== ACCOUNT ===== */


.account{

    position:relative;

}


.account-button{

    display:flex;

    align-items:center;

    gap:10px;

    cursor:pointer;

    padding:7px;

    border-radius:30px;

    transition:.3s;

}


.account-button:hover{

    background:#333;

}



.avatar{

    width:38px;
    height:38px;

    border-radius:50%;

    background:#555;

}



.account-menu{

    position:absolute;

    right:0;

    top:55px;

    width:220px;

    background:#222;

    border-radius:15px;

    padding:10px;

    opacity:0;

    transform:translateY(-10px);

    pointer-events:none;

    transition:.3s;

    box-shadow:0 10px 30px black;

}



.account-menu.show{

    opacity:1;

    transform:translateY(0);

    pointer-events:auto;

}


.account-item{

    padding:12px;

    border-radius:10px;

    cursor:pointer;

}


.account-item:hover{

    background:#333;

}




/* ===== MAIN ===== */


.main{

    display:flex;

    height:calc(100vh - 60px);

}



.sidebar{

    width:230px;

    border-right:1px solid #222;

    padding:15px;

    display:flex;

    flex-direction:column;

}



.menu{

    padding:13px;

    border-radius:12px;

    cursor:pointer;

    transition:.2s;

    margin-bottom:5px;

}



.menu:hover{

    background:var(--hover);

    transform:translateX(5px);

}



.menu.active{

    background:var(--panel);

}



.space{

    flex:1;

}




.content{

    flex:1;

    overflow:auto;

    padding:25px;

}





.page{

    animation:show .25s;

}



@keyframes show{

from{

opacity:0;

transform:translateY(10px);

}

to{

opacity:1;

transform:translateY(0);

}

}



.hidden{

    display:none;

}




/* ===== VIDEA ===== */


.video-grid{

    display:grid;

    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));

    gap:20px;

}



.video-card{

    cursor:pointer;

    transition:.3s;

}



.video-card:hover{

    transform:scale(1.03);

}



.thumbnail{

    width:100%;

    aspect-ratio:16/9;

    background:#000;

    border-radius:14px;

    overflow:hidden;

}



.thumbnail video{

    width:100%;

    height:100%;

    object-fit:cover;

}





/* ===== PLAYER ===== */


.player-box{

    max-width:1000px;

}



.big-video{

    width:100%;

    border-radius:15px;

    background:black;

}



.actions{

    display:flex;

    gap:10px;

    margin-top:15px;

}



.btn{

    background:#272727;

    color:white;

    border:0;

    padding:10px 18px;

    border-radius:25px;

    cursor:pointer;

}



.btn:hover{

    background:#444;

}


</style>


</head>

<body>


<header>


<div class="logo">

<div class="logo-box"></div>

SirTros Video

</div>




<input class="search" id="search" placeholder="Hledat...">





<div class="account">


<div class="account-button" onclick="toggleAccount()">

<div class="avatar"></div>

<span id="account-name">
Účet
</span>


</div>




<div class="account-menu" id="account-menu">


<div class="account-item">
👤 Profil
</div>


<div class="account-item">
⚙ Nastavení
</div>


<div class="account-item" onclick="logout()">
🚪 Odhlásit
</div>


</div>


</div>



</header>






<div class="main">



<nav class="sidebar">


<div class="menu active" onclick="openPage('home')">

🏠 Domů

</div>



<div class="menu" onclick="openPage('shorts')">

🎬 Shorts

</div>




<div class="menu" onclick="openPage('subs')">

🔔 Odběry

</div>




<div class="space"></div>



<div class="menu" onclick="openPage('history')">

📜 Historie

</div>



</nav>








<main class="content">





<!-- DOMŮ -->


<section id="home" class="page">


<h2>Domů</h2>



<div class="video-grid" id="video-list">

</div>



</section>









<!-- SHORTS -->


<section id="shorts" class="page hidden">


<h2>🎬 Shorts</h2>


<p>
Shorts se zatím dokončují.
</p>


</section>









<!-- ODBĚRY -->


<section id="subs" class="page hidden">


<h2>🔔 Odběry</h2>


<div id="subs-list">

Zatím žádné odběry.

</div>


</section>









<!-- HISTORIE -->


<section id="history" class="page hidden">


<h2>📜 Historie</h2>


<div id="history-list">

Historie je prázdná.

</div>


</section>









<!-- PŘEHRÁVAČ -->


<section id="player-page" class="page hidden player-box">



<video id="player" class="big-video" controls>

</video>




<h1 id="video-title">

</h1>



<p id="video-channel">

</p>





<div class="actions">


<button class="btn" onclick="likeVideo()">

👍 Like

</button>



<button class="btn" onclick="subscribe()">

🔔 Odebírat

</button>



<button class="btn" onclick="shareVideo()">

📤 Sdílet

</button>



</div>





</section>






</main>



</div>


<script>


// ===========================
// SUPABASE
// ===========================

const SUPABASE_URL = "https://thcpkomwqirnsthwsbab.supabase.co/";
const SUPABASE_KEY = "sb_publishable_psbTX5zdREimrnH0jMnl5A_0wb1k_UE";


const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);





// ===========================
// VIDEA
// ===========================


const videos = [

{
    id:1,
    title:"SirTros Minihry | Jak se připojit",
    channel:"SirTros",
    src:"https://thcpkomwqirnsthwsbab.supabase.co/storage/v1/object/public/Videos/video1.mp4"
},


{
    id:2,
    title:"Jak přidat novou instalaci | Minecraft",
    channel:"SirTros",
    src:"https://thcpkomwqirnsthwsbab.supabase.co/storage/v1/object/public/Videos/video2.mp4"
}

];



let currentVideo=null;







// ===========================
// STRÁNKY
// ===========================


function openPage(page){


document.querySelectorAll(".page")
.forEach(p=>{

p.classList.add("hidden");

});



document.getElementById(page)
.classList.remove("hidden");


}




// ===========================
// ÚČET MENU
// ===========================


function toggleAccount(){


document
.getElementById("account-menu")
.classList.toggle("show");


}




document.addEventListener(
"click",
function(e){


let menu=document.getElementById("account-menu");

let account=document.querySelector(".account");


if(!account.contains(e.target)){


menu.classList.remove("show");


}


});







// ===========================
// VYKRESLENÍ VIDEÍ
// ===========================


function loadVideos(){


let box =
document.getElementById("video-list");



box.innerHTML="";



videos.forEach(v=>{


box.innerHTML+=`


<div class="video-card"
onclick="playVideo(${v.id})">


<div class="thumbnail">

<video muted preload="metadata">

<source src="${v.src}">

</video>

</div>


<h3>${v.title}</h3>

<p style="color:#aaa">

${v.channel}

</p>


</div>


`;

});


}







// ===========================
// PŘEHRÁVAČ
// ===========================


function playVideo(id){


let video =
videos.find(v=>v.id===id);



if(!video)return;



currentVideo=video;



let player =
document.getElementById("player");



player.src=video.src;

player.play();



document.getElementById("video-title")
.innerText=video.title;



document.getElementById("video-channel")
.innerText=video.channel;



openPage("player-page");



addHistory(video);


}









// ===========================
// HISTORIE 7 DNÍ
// ===========================


function addHistory(video){


let history =
JSON.parse(
localStorage.getItem("history") || "[]"
);



history.unshift({

...video,

time:Date.now()

});



history =
history.filter(
(v,i,a)=>
a.findIndex(x=>x.id===v.id)===i
);



localStorage.setItem(
"history",
JSON.stringify(history)
);



cleanHistory();


loadHistory();


}






function cleanHistory(){


let history =
JSON.parse(
localStorage.getItem("history") || "[]"
);



let sevenDays =
7*24*60*60*1000;



history =
history.filter(v=>{

return Date.now()-v.time < sevenDays;

});



localStorage.setItem(
"history",
JSON.stringify(history)
);


}







function loadHistory(){


cleanHistory();



let box =
document.getElementById("history-list");



let history =
JSON.parse(
localStorage.getItem("history") || "[]"
);



if(history.length===0){

box.innerHTML="Historie je prázdná.";

return;

}




box.innerHTML="";



history.forEach(v=>{


box.innerHTML+=`

<div class="video-card"
onclick="playVideo(${v.id})">


<h3>${v.title}</h3>

<p>${v.channel}</p>


</div>


`;


});


}







// ===========================
// LIKE
// ===========================


async function likeVideo(){


if(!currentVideo)return;



alert(
"Like pro video "+currentVideo.title
);



}





// ===========================
// ODBĚR
// ===========================


async function subscribe(){



if(!currentVideo)return;



alert(
"Odebíráš "+currentVideo.channel
);



}







// ===========================
// SDÍLENÍ
// ===========================


async function shareVideo(){


if(!currentVideo)return;



if(navigator.share){


navigator.share({

title:currentVideo.title,

url:location.href

});


}

else{


navigator.clipboard.writeText(location.href);


alert("Odkaz zkopírován");


}


}






// ===========================
// LOGIN START
// ===========================


async function loadUser(){


const {data}=

await supabaseClient.auth.getUser();



if(data.user){


document.getElementById("account-name")
.innerText=
data.user.email;


}


}




async function logout(){


await supabaseClient.auth.signOut();


document.getElementById("account-name")
.innerText="Účet";


}







// START


loadVideos();

loadHistory();

loadUser();



</script>


</body>
</html>
