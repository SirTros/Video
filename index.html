<!DOCTYPE html>
<html lang="cs">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SirTros Video</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{
    --bg:#0f0f0f;
    --card:#181818;
    --panel:#272727;
    --hover:#3f3f3f;
    --text:#fff;
    --gray:#aaa;
    --red:#ff0000;
}


*{
    box-sizing:border-box;
}


body{
    margin:0;
    background:var(--bg);
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
}



/* HEADER */

.header{

    height:60px;
    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 22px;

    border-bottom:1px solid #222;

}



.logo{

    display:flex;
    align-items:center;
    gap:10px;

    font-size:22px;
    font-weight:bold;

}



.logo-icon{

    width:36px;
    height:25px;

    background:red;

    border-radius:8px;

    display:flex;
    justify-content:center;
    align-items:center;

}



.logo-icon:after{

    content:"";

    border-left:11px solid white;
    border-top:7px solid transparent;
    border-bottom:7px solid transparent;

}




.search{

    width:420px;

    background:#121212;

    border:1px solid #333;

    color:white;

    padding:12px 20px;

    border-radius:30px;

    outline:none;

}




/* ÚČET */

.account{

    position:relative;

}



.account-btn{

    display:flex;

    align-items:center;

    gap:10px;

    cursor:pointer;

    padding:8px;

    border-radius:30px;

    transition:.3s;

}



.account-btn:hover{

    background:var(--hover);

}



.avatar{

    width:38px;
    height:38px;

    border-radius:50%;

    background:#555;

}




.profile-menu{

    position:absolute;

    right:0;

    top:55px;

    background:#222;

    width:220px;

    border-radius:15px;

    padding:10px;

    opacity:0;

    transform:translateY(-10px);

    pointer-events:none;

    transition:.3s;

    box-shadow:0 10px 30px #000;

}



.profile-menu.show{

    opacity:1;

    transform:translateY(0);

    pointer-events:auto;

}



.profile-item{

    padding:12px;

    border-radius:10px;

    cursor:pointer;

}



.profile-item:hover{

    background:#333;

}



/* BODY */


.main{

    display:flex;

    height:calc(100vh - 60px);

}




.sidebar{

    width:240px;

    padding:15px;

    border-right:1px solid #222;

    display:flex;

    flex-direction:column;

}



.menu{

    padding:13px;

    border-radius:12px;

    cursor:pointer;

    margin-bottom:5px;

    transition:.2s;

}



.menu:hover{

    background:var(--hover);

    transform:translateX(5px);

}



.menu.active{

    background:var(--panel);

}



.spacer{

    flex:1;

}





.content{

    flex:1;

    padding:25px;

    overflow:auto;

}





.page{

    animation:fade .25s;

}



@keyframes fade{

    from{

        opacity:0;

        transform:translateY(10px);

    }

    to{

        opacity:1;

        transform:translateY(0);

    }

}





.video-grid{

    display:grid;

    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));

    gap:20px;

}



.video-card{

    cursor:pointer;

    transition:.3s;

}



.video-card:hover{

    transform:translateY(-5px);

}



.thumbnail{

    width:100%;

    aspect-ratio:16/9;

    background:#000;

    border-radius:14px;

}





.hidden{

    display:none;

}




button{

    background:white;

    color:black;

    border:0;

    padding:10px 18px;

    border-radius:25px;

    cursor:pointer;

}



</style>

</head>


<body>



<header class="header">


<div class="logo">

<div class="logo-icon"></div>

SirTros Video

</div>




<input class="search" placeholder="Hledat...">





<div class="account">


<div class="account-btn" onclick="toggleProfile()">

<div class="avatar"></div>

<span id="account-name">

Účet

</span>

</div>



<div class="profile-menu" id="profile">

<div class="profile-item">

👤 Profil

</div>


<div class="profile-item">

⚙ Nastavení

</div>


<div class="profile-item" onclick="logout()">

🚪 Odhlásit

</div>


</div>


</div>



</header>






<div class="main">



<nav class="sidebar">



<div class="menu active" onclick="openPage('home')">

🏠 Domů

</div>



<div class="menu" onclick="openPage('shorts')">

🎬 Shorts

</div>



<div class="menu" onclick="openPage('subs')">

🔔 Odběry

</div>



<div class="spacer"></div>




<div class="menu" onclick="openPage('history')">

📜 Historie

</div>



</nav>







<main class="content">



<section id="home" class="page">

<h2>Domů</h2>

<div class="video-grid" id="video-list">

</div>

</section>






<section id="shorts" class="page hidden">

<h2>🎬 Shorts</h2>

<p>

Shorts se zatím dokončují.

</p>

</section>






<section id="subs" class="page hidden">

<h2>🔔 Odběry</h2>

<div id="subs-list">

Zatím žádné odběry.

</div>

</section>






<section id="history" class="page hidden">

<h2>📜 Historie</h2>

<div id="history-list">

Historie je prázdná.

</div>

</section>




</main>



</div>





<script src="script.js"></script>


</body>
</html>
